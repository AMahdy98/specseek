[project]
name = "specseek"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.6",
    "pymupdf>=1.28.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: import order, B: bugbear, UP: modern syntax,
# ASYNC: flags blocking calls (time.sleep, open, requests) inside async def.
select = ["E", "F", "I", "B", "UP", "ASYNC"]
