# Candidate evaluation questions (40). Pick 20, VERIFY each against the PDF, then move them
# into eval/questions.yaml with ids q01..q20. Rewording them in your own words is encouraged.
#
# How these were made (disclose this in docs/EVAL.md):
#   - Proposed by the AI assistant on 2026-10-04 from the text stored in the database, i.e. from
#     the PDFs themselves. Every `expected` is taken from the cited passage, not from memory.
#   - `page` is the PDF page number (what a PDF viewer shows), not the printed page number.
#   - `clause` is the clause as printed in the document. SpecSeek may label the same passage
#     differently (known limitation: FDA Premarket subsections VI.A-VI.J are cited as "VI").
#   - Unanswerable candidates were checked by keyword search: the topic does not occur in
#     the corpus (or the standard is only named, never described).
#
# Known weaknesses of this candidate set, so you can correct for them when choosing:
#   - The assistant has seen how the documents were chunked, which can bias question choice
#     towards passages that chunk cleanly. Prefer the table and cross-reference ones, and
#     add questions of your own from your FDA validation experience.
#   - c15 was already asked once during the phase 3 smoke test (answered correctly). Using it
#     is fine, but it is not "unseen".
#
# Balance to aim for in your 20: about 12 direct, 3-4 table, 2-3 cross_reference, 2-3 unanswerable,
# spread over all four documents.

candidates:

  # ------------------------------------------------------------------ NPR 7150.2D (14)

  - id: c01
    type: direct
    question: How thoroughly must safety-critical code be exercised by tests, and against which coverage criterion?
    expected: 100 percent code test coverage using the Modified Condition/Decision Coverage (MC/DC)
      criterion, for all identified safety-critical software components. [SWE-219]
    document: NPR-7150.2D
    clause: "3.7.4"
    page: 26

  - id: c02
    type: direct
    question: Is there an upper limit on how complex a safety-critical software component is allowed to be?
    expected: Yes. A cyclomatic complexity value of 15 or lower. Any exceedance shall be reviewed and
      waived with rationale by the project manager or technical approval authority. [SWE-220]
    document: NPR-7150.2D
    clause: "3.7.5"
    page: 27

  - id: c03
    type: direct
    question: How many cost estimation models are needed for a Class A project expected to cost more than two million dollars?
    expected: Two cost estimate models and associated cost parameters (for Class A and B software
      projects with an estimated project cost of $2 million or more). [SWE-015]
    document: NPR-7150.2D
    clause: "3.2.1"
    page: 23

  - id: c04
    type: direct
    question: Which kinds of projects are obliged to have independent verification and validation of their software?
    expected: Projects reaching Key Decision Point A that are (a) Category 1 projects per NPR 7120.5,
      (b) Category 2 projects per NPR 7120.5 with a Class A or Class B payload risk classification
      per NPR 8705.4, or (c) projects selected explicitly by the Mission Directorate Associate
      Administrator. [SWE-141]
    document: NPR-7150.2D
    clause: "3.6.2"
    page: 25

  - id: c05
    type: direct
    question: Who has the final say when a project wants to tailor the IV&V requirement?
    expected: The NASA Chief, SMA shall make the final decision on all proposed tailoring of SWE-141,
      the IV&V requirement. [SWE-223]
    document: NPR-7150.2D
    clause: "2.1.2.7"
    page: 12

  - id: c06
    type: direct
    question: What process maturity rating must an organization hold to develop Class A software, and what about Class B?
    expected: Class A needs a non-expired CMMI-DEV Maturity Level 3 rating or higher; Class B
      (except Class B software on NASA Class D payloads) needs Maturity Level 2 or higher. [SWE-032]
    document: NPR-7150.2D
    clause: "3.9.2"
    page: 28

  - id: c07
    type: direct
    question: What has to be true before a project may use an open-source or commercial off-the-shelf software component?
    expected: Six conditions [SWE-027] - (a) the requirements the component must meet are identified;
      (b) it includes documentation to fulfil its intended purpose; (c) proprietary, usage, ownership,
      warranty, licensing and transfer rights and conditions of use are addressed and coordinated with
      Center Intellectual Property Counsel; (d) future support is planned and adequate; (e) it is
      verified and validated to the same level as a similar developed component; (f) there is a plan
      for periodic assessment of vendor-reported defects.
    document: NPR-7150.2D
    clause: "3.1.14"
    page: 22

  - id: c08
    type: direct
    question: What are static analysis tools required to look for, as a minimum?
    expected: Defects, software security, code coverage, and software complexity, during the
      development and testing phases. [SWE-135]
    document: NPR-7150.2D
    clause: "4.4.4"
    page: 34

  - id: c09
    type: direct
    question: How many separate operator actions does it take to override a function of safety-critical software?
    expected: At least two independent actions by an operator (item d of the list in SWE-134).
    document: NPR-7150.2D
    clause: "3.7.3"
    page: 26

  - id: c10
    type: direct
    question: If measured structural code coverage is below 100 percent, what are the possible reasons the directive lists?
    expected: One of four things - requirement missing, test missing, extraneous/dead code, or
      deactivated code; each requires action by the project manager. (In the note to SWE-189.)
    document: NPR-7150.2D
    clause: "4.5.9"
    page: 36

  - id: c11
    type: direct
    question: What severity categories should a defect classification scheme contain at the very least?
    expected: At a minimum - loss of life or loss of vehicle, mission success, visible to the user
      with operational workarounds, and an 'other' class that does not meet the previous criteria.
      (Note to SWE-202.)
    document: NPR-7150.2D
    clause: "5.5.2"
    page: 42

  - id: c12
    type: table
    question: Which authority has to sign off on tailoring the CMMI rating requirement for software developers?
    expected: HQ OCE and HQ OSMA (Authority column of the Requirements Mapping Matrix, row 3.9.2 /
      SWE-032). Most other rows name "Center".
    document: NPR-7150.2D
    clause: "Appendix C, row 3.9.2 (SWE-032)"
    page: 66

  - id: c13
    type: cross_reference
    question: A project has safety-critical software. Where are the safety-critical software requirements it must implement?
    expected: In NASA-STD-8739.8 - the project manager shall implement the safety-critical software
      requirements contained in NASA-STD-8739.8. [SWE-023]
    document: NPR-7150.2D
    clause: "3.7.2"
    page: 26

  - id: c14
    type: cross_reference
    question: When static analysis is run on safety-critical code, which specific thresholds does it have to take into account?
    expected: The note to SWE-135 (4.4.4) points to 3.7.5 and 3.7.4 - cyclomatic complexity of 15 or
      lower, and 100 percent code test coverage using MC/DC. (The answer needs two other clauses.)
    document: NPR-7150.2D
    clause: "4.4.4 -> 3.7.5, 3.7.4"
    page: 34

  # ------------------------------------------------------------------ NASA-STD-8739.8B (8)

  - id: c15
    type: direct
    question: What makes a piece of software count as safety-critical?
    expected: It is determined by and traceable to a hazard analysis, and meets at least one of -
      (a) causes or contributes to a system hazardous condition/event, (b) controls functions
      identified in a system hazard, (c) provides mitigation for a system hazardous condition/event,
      (d) mitigates damage if a hazardous condition/event occurs, (e) detects, reports, and takes
      corrective action if the system reaches a potentially hazardous state.
    document: NASA-STD-8739.8B
    clause: "4.2"
    page: 20

  - id: c16
    type: direct
    question: In what ways must an IV&V team be independent of the project it examines?
    expected: Three parameters - technical independence, managerial independence, and financial
      independence.
    document: NASA-STD-8739.8B
    clause: "4.4.1.2"
    page: 52

  - id: c17
    type: direct
    question: Who writes the IV&V project execution plan, and who has to agree to it?
    expected: The IV&V provider shall develop and negotiate the IPEP with the project (4.4.2.2); the
      Project SMA Technical Authority shall review and concur with it (4.4.2.3).
    document: NASA-STD-8739.8B
    clause: "4.4.2.2, 4.4.2.3"
    page: 54

  - id: c18
    type: direct
    question: What are the successive levels at which the assurance standard's requirements get tailored?
    expected: Three levels - (a) the Software Classification Decision, (b) the project's Software
      Requirements Mapping Matrix, (c) tailoring by the Software Assurance TA of the standard's
      requirements that correspond to the project's mapping matrix.
    document: NASA-STD-8739.8B
    clause: "4.5"
    page: 60

  - id: c19
    type: direct
    question: What is the difference between the two main activities an IV&V provider carries out?
    expected: Verification evaluates whether a product conforms to the build-to requirements and
      design specifications; validation develops objective evidence that the content of the
      engineering artifact is the right content (it satisfies the system requirements and solves
      the right problem).
    document: NASA-STD-8739.8B
    clause: "4.4.1.4"
    page: 53

  - id: c20
    type: table
    question: What does software assurance have to do about cyclomatic complexity when a component exceeds the limit?
    expected: Perform or analyze cyclomatic complexity metrics on all identified safety-critical
      components and confirm a value of 15 or lower; if not, assure the developers provide a
      technically acceptable risk assessment, accepted by the proper technical authority, explaining
      why it must be higher than 15 and why the component cannot be restructured or why reducing
      it is not justified.
    document: NASA-STD-8739.8B
    clause: "Table 1, row 3.7.5 (SWE-220)"
    page: 31

  - id: c21
    type: table
    question: Which software problems does the standard list under programmable logic devices when looking for hazard causes?
    expected: Four - high cyclomatic complexity levels (above 15); errors in programming and
      simulation tools used for PLC development; errors in the programmable logic device interfaces;
      errors in the logic design.
    document: NASA-STD-8739.8B
    clause: "Appendix A, Table 2 (A.1.4)"
    page: 63

  - id: c22
    type: cross_reference
    question: How does a project obtain relief from a requirement of the software assurance standard, and who approves it?
    expected: Tailoring is documented as part of program/project requirements and approved by the
      responsible Center Technical Authority per NPR 8715.3 (1.4), which points to section 4.5 -
      there, the SMA TA for the project shall review and approve any tailored requirements.
    document: NASA-STD-8739.8B
    clause: "1.4 -> 4.5"
    page: 6

  # ------------------------------------------------------------------ FDA Premarket guidance (8)

  - id: c23
    type: direct
    question: What decides whether a device needs the more extensive level of software documentation?
    expected: Enhanced Documentation applies where a failure or flaw of any device software function
      could present a hazardous situation with a probable risk of death or serious injury to a patient,
      user, or others in the environment of use, assessed prior to implementation of risk control
      measures. Otherwise Basic.
    document: FDA-Premarket
    clause: "V"
    page: 12

  - id: c24
    type: direct
    question: How is a serious injury defined for the purpose of choosing the documentation level?
    expected: An injury or illness that (1) is life threatening, (2) results in permanent impairment
      of a body function or permanent damage to a body structure, or (3) necessitates medical or
      surgical intervention to preclude such permanent impairment or damage.
    document: FDA-Premarket
    clause: "IV"
    page: 10

  - id: c25
    type: table
    question: Does a submission at the lower documentation level have to include the software design specification?
    expected: No. For the Basic Documentation Level FDA is not recommending the SDS as part of the
      premarket submission; the sponsor documents it internally via the DHF, and FDA may request more
      information during review.
    document: FDA-Premarket
    clause: "VI.F (Table 1 and Software Design Specification)"
    page: 27

  - id: c26
    type: table
    question: What testing evidence is expected at the higher documentation level on top of what the lower level already asks for?
    expected: Unit and integration level test protocols including expected results, observed results,
      pass/fail determination, and unit and integration level test reports.
    document: FDA-Premarket
    clause: "VI.H (Table 1)"
    page: 16

  - id: c27
    type: direct
    question: What should be written down for each known bug that is left unfixed at release?
    expected: For each unresolved anomaly - a description; how it was discovered and, where possible,
      its root cause(s); an evaluation of its impact on safety and effectiveness, including operator
      usage and human factors; the outcome of the evaluation; and the risk-based rationale for not
      correcting it.
    document: FDA-Premarket
    clause: "VI.J"
    page: 31

  - id: c28
    type: direct
    question: What belongs in the record of software versions?
    expected: The history of tested software versions - date, version number, and a brief description
      of all changes relative to the previously tested version. The last entry is the final version
      to be released, including any differences between the tested and released version and an
      assessment of their effect on safety and effectiveness.
    document: FDA-Premarket
    clause: "VI.I"
    page: 30

  - id: c29
    type: direct
    question: Can a manufacturer rely on conformity to a recognized standard instead of describing its development and maintenance practices?
    expected: Yes. A sponsor may provide a Declaration of Conformity to the FDA-recognized version of
      ANSI/AAMI/IEC 62304 (for Basic, subclauses 5.1.1-5.1.3 and 5.1.6-5.1.9, clause 6 and clause 8,
      among others as applicable).
    document: FDA-Premarket
    clause: "VI.G"
    page: 28

  - id: c30
    type: direct
    question: Does the guidance tell manufacturers to follow a particular development model such as Agile or waterfall?
    expected: No. It does not recommend any specific software life cycle model or development
      methodology; sponsors should establish one appropriate for their product and organization that
      meets the applicable regulatory requirements.
    document: FDA-Premarket
    clause: "III"
    page: 10

  # ------------------------------------------------------------------ FDA Off-The-Shelf guidance (5)

  - id: c31
    type: direct
    question: What identifying details should be given for every third-party software component built into a device?
    expected: Title and manufacturer; version level, release date, patch number and upgrade
      designation, as appropriate; any OTS documentation that will be provided to the end user; why
      the OTS software is appropriate for this device; and its expected design limitations.
    document: FDA-OTS
    clause: "III.A.1"
    page: 7

  - id: c32
    type: direct
    question: What should a device do when it starts up and finds the wrong version of a third-party component installed?
    expected: On startup the device should check that all software is the correct title, version level
      and configuration; if the correct software is not loaded, it should warn the operator and shut
      down to a safe state.
    document: FDA-OTS
    clause: "III.A.6"
    page: 9

  - id: c33
    type: direct
    question: A software vendor will not reveal its confidential development and validation details to the device maker. What option does it have?
    expected: It may direct the information to FDA in a device master file (MAF).
    document: FDA-OTS
    clause: "IV.A"
    page: 11

  - id: c34
    type: direct
    question: What should the user manual tell users about which software versions may be used with the device?
    expected: It should specify the version(s) of the OTS software that can be used, and warn that using
      any other software will violate the safety, effectiveness and design controls of the device and
      may increase risk to users and patients. Not needed for embedded software the user cannot change.
    document: FDA-OTS
    clause: "IV.E"
    page: 12

  - id: c35
    type: cross_reference
    question: How much testing documentation for a third-party component is expected, and what determines that?
    expected: It depends on the Documentation Level (Basic or Enhanced) determined for the device under
      the guidance "Content of Premarket Submissions for Device Software Functions"; the sponsor should
      describe testing, verification and validation of the OTS software appropriate to its hazards and
      provide the results. (The level criteria themselves are in the other guidance, section V.)
    document: FDA-OTS
    clause: "III.A.5 -> FDA-Premarket V"
    page: 8

